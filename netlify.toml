[build]
  base = "application"
  command = "npm run build"
  publish = "build"

[build.environment]
  REACT_APP_API_BASE_URL = "https://surreal-lullaby-dominoes.ngrok-free.dev/HoloraPerformance"
  REACT_APP_SECTION = "main"
  CI = "false"
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200